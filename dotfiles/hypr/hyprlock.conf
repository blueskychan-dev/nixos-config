# ~/.config/hypr/hyprlock.conf — lock screen (runs on sway via ~/.config/sway/lock.sh)
#
#  DP-1 (main):  avatar + name + password in the middle,
#                big thin clock bottom-left, now playing bottom-right.
#  DP-2:         just the blurred wallpaper.
#
# Accents match the avatar: peach #f4b183 · rose #e0697a (hair / glasses)
# Avatar = ~/.face (symlink — point it at any square image).
# Dynamic text comes from ~/.config/hypr/lockinfo.sh (hyprlang would choke on it).
# Check this file without locking:  WAYLAND_DISPLAY=x hyprlock 2>&1 | head

$main = DP-1
$font = Noto Sans
$mono = JetBrainsMono Nerd Font

general {
    hide_cursor = false
    ignore_empty_input = true
}

# Reuse the PAM service NixOS already ships for swaylock (no rebuild needed).
auth {
    pam:enabled = true
    pam:module = swaylock
}

animations {
    enabled = true
    bezier = soft, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 4, soft
    animation = fadeOut, 1, 3, soft
    animation = inputFieldDots, 1, 2, soft
    animation = inputFieldColors, 1, 4, soft
}

# Pre-blurred wallpaper (built once per wallpaper by lock.sh), every screen.
background {
    monitor =
    path = ~/.cache/lockscreen/current.png
    color = rgb(1e1e2e)
    blur_passes = 0
}

# ── Center: who's locked ───────────────────────────────────────────
image {
    monitor = $main
    path = ~/.face
    size = 132
    rounding = -1
    border_size = 3
    border_color = rgba(f4b183ee) rgba(e0697aee) 45deg
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.35)
    position = 0, 96
    halign = center
    valign = center
}

label {
    monitor = $main
    text = $USER
    font_family = $font Medium
    font_size = 19
    color = rgba(cdd6f4ff)
    shadow_passes = 2
    shadow_color = rgba(0, 0, 0, 0.5)
    position = 0, -6
    halign = center
    valign = center
}

input-field {
    monitor = $main
    size = 280, 46
    outline_thickness = 2
    rounding = -1

    inner_color = rgba(11111b99)
    outer_color = rgba(ffffff22)
    font_color = rgb(cdd6f4)
    check_color = rgba(f4b183ee) rgba(e0697aee) 45deg
    fail_color = rgb(f38ba8)
    capslock_color = rgb(ff9a56)

    font_family = $font
    placeholder_text = <span alpha="55%">password  ·  $LAYOUT</span>
    fail_text = <span>$FAIL</span>
    fade_on_empty = false

    dots_size = 0.2
    dots_spacing = 0.45
    dots_center = true
    dots_rounding = -1

    shadow_passes = 2
    shadow_color = rgba(0, 0, 0, 0.3)
    position = 0, -62
    halign = center
    valign = center
}

# ── Bottom-left: date + time (one label, so they can never overlap) ──
label {
    monitor = $main
    text = cmd[update:1000] ~/.config/hypr/lockinfo.sh clock
    font_family = $font
    font_size = 13
    color = rgba(cdd6f4f2)
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.4)
    position = 80, 56
    halign = left
    valign = bottom
}

# ── Bottom-right: now playing (empty when nothing plays) ───────────
label {
    monitor = $main
    text = cmd[update:2000] ~/.config/hypr/lockinfo.sh music
    text_align = right
    font_family = $font
    font_size = 14
    color = rgba(cdd6f4dd)
    shadow_passes = 2
    shadow_color = rgba(0, 0, 0, 0.5)
    position = -84, 84
    halign = right
    valign = bottom
}
